# bitcoin.conf — regtest for NostrAgent prototype
regtest=1
server=1
daemon=0
txindex=1

# RPC credentials (plain user/pass is fine for regtest/dev)
rpcuser=nostr
rpcpassword=nostr

# ZMQ — must be in [regtest] section for Bitcoin Core v27+
# Fallback fee required for regtest sendtoaddress
fallbackfee=0.0002
minrelaytxfee=0.00001

[regtest]
# Network-specific settings (required in section for v27+)
rpcallowip=0.0.0.0/0
rpcbind=0.0.0.0
rpcport=18443
bind=0.0.0.0
zmqpubrawblock=tcp://0.0.0.0:28332
zmqpubrawtx=tcp://0.0.0.0:28333
