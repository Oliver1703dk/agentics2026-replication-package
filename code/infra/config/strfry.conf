##
## strfry.conf — NostrAgent prototype relay configuration
##
## Accepts ALL event kinds by default (including 38100, 38101, 38102).
## No writePolicy plugin needed for dev/test — open relay.
##

db = "./strfry-db/"

dbParams {
    maxreaders = 256
    mapsize = 10995116277760
}

relay {
    # Bind to all interfaces inside the container
    bind = "0.0.0.0"
    port = 7777
    nofiles = 0

    info {
        name = "NostrAgent Dev Relay"
        description = "Development relay for NostrAgent prototype (kinds 38100-38102)"
        pubkey = ""
        contact = ""
    }

    # No rate-limiting for dev
    maxWebsocketPayloadSize = 131072
    autoPingSeconds = 55
    enableTcpKeepalive = false
    tcpKeepaliveIdleSecs = 120
    tcpKeepaliveIntervalSecs = 10
    tcpKeepaliveProbeCount = 6

    compression {
        enabled = true
        slidingWindow = true
    }

    limits {
        maxSubsPerConnection = 20
        maxFiltersPerSub = 10
    }
}

events {
    maxEventSize = 65536
    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 94608000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300

    # allowedKinds empty = accept ALL kinds (38100, 38101, 38102 included)
    allowedKinds = []
}

writePolicy {
    # Empty = no plugin, accept everything. For production: path to executable.
    plugin = ""
    timeoutSeconds = 10
}

logging {
    deflateRawReq = false
    nwcRawReq = false
    invalidEvents = true
}

negentropy {
    enabled = true
    maxSyncEvents = 1000000
}
